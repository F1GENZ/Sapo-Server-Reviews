name: Verify Sapo Reviews API & Worker (VPS Deploy Retired)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sapo-reviews-api-deploy
  cancel-in-progress: false

jobs:
  verify-server:
    name: Server lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  verify-client:
    name: Client build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

  e2e:
    name: E2E
    uses: ./.github/workflows/ci-e2e.yml
    with:
      skip-verify: true

  verify-worker:
    name: Worker typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck and test
        working-directory: worker
        run: npm run typecheck && npm test

